<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Admin Panel - Nihongo Mastery
    </title>

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(135deg,
                    #0f2027,
                    #203a43,
                    #2c5364);

            color: white;

            min-height: 100vh;

        }

        .container {

            max-width: 1300px;

            margin: auto;

        }

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 20px;

            margin-bottom: 30px;

        }

        .card {

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(12px);

            border-radius: 25px;

            padding: 25px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3);

        }

        h1 {

            margin-top: 0;

            color: gold;

        }

        .stats-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit,
                    minmax(250px, 1fr));

            gap: 20px;

            margin-bottom: 30px;

        }

        .big-number {

            font-size: 2.5rem;

            font-weight: bold;

            color: #00ff88;

        }

        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 20px;

        }

        th {

            background:
                rgba(255, 215, 0, 0.2);

            padding: 15px;

            text-align: left;

        }

        td {

            padding: 15px;

            background:
                rgba(255, 255, 255, 0.05);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.05);

        }

        .approve-btn {

            border: none;

            background:
                linear-gradient(135deg,
                    #00c853,
                    #00e676);

            color: white;

            padding: 10px 18px;

            border-radius: 12px;

            cursor: pointer;

            font-weight: bold;

        }

        .approve-btn:hover {

            transform: scale(1.05);

        }

        .reload-btn {

            border: none;

            background:
                linear-gradient(135deg,
                    #ffd700,
                    #ff9800);

            color: black;

            padding: 12px 20px;

            border-radius: 15px;

            cursor: pointer;

            font-weight: bold;

        }

        .debug-box {

            margin-top: 20px;

            background:
                rgba(0, 0, 0, 0.4);

            padding: 20px;

            border-radius: 15px;

            overflow-x: auto;

            font-size: 0.9rem;

        }

        .empty-box {

            text-align: center;

            padding: 40px;

            color: #ccc;

        }

        .pill {

            display: inline-block;

            padding: 10px 18px;

            border-radius: 999px;

            font-weight: bold;

            background:
                rgba(255, 255, 255, 0.12);

        }

        @media(max-width:768px) {

            table {

                display: block;

                overflow-x: auto;

            }

        }
    </style>

</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <div>

                <h1>
                    🛠 Admin Panel
                </h1>

                <div class="pill">
                    Nihongo Mastery
                </div>

            </div>

            <button class="reload-btn" onclick="loadPayments()">

                🔄 Reload Data

            </button>

        </div>

        <!-- STATS -->

        <div class="stats-grid">

            <div class="card">

                <h3>
                    ⏳ Pending Payments
                </h3>

                <div class="big-number" id="pendingCount">

                    0

                </div>

            </div>

        </div>

        <!-- TABLE -->

        <div class="card">

            <h2>
                💳 Pending Payments
            </h2>

            <table>

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            User ID
                        </th>

                        <th>
                            Plan
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody id="paymentsBody">

                    <tr>

                        <td colspan="6">
                            Loading...
                        </td>

                    </tr>

                </tbody>

            </table>

            <div class="debug-box" id="debugBox">

                Debug:
                waiting...

            </div>

        </div>

    </div>

    <script>

        // =====================================
        // CONFIG
        // =====================================

        const GAS_URL =
            'https://script.google.com/macros/s/AKfycbzdDuFwNNMQQUoV3YAhzJctS9M2t0wr8c3WDwIU5fc1q8Lb1mHmFAwsCUEXIL_s1zMC/exec';

    const ADMIN_KEY =
        'nihongo_mastery_admin_2026';

        // =====================================
        // INIT
        // =====================================

        loadPayments();

        // =====================================
        // DEBUG
        // =====================================

        function debug(msg) {

            console.log(msg);

            document.getElementById(
                'debugBox'
            ).innerHTML +=
                `<br>${msg}`;

        }

        // =====================================
        // LOAD PAYMENTS
        // =====================================

   async function loadPayments() {

        debug('LOAD PAYMENTS...');

        try {

            const url =
                `${GAS_URL}?action=get_pending_payments&admin_key=${ADMIN_KEY}`;

            console.log('FETCH URL:', url);

            const response =
                await fetch(url);

            const text =
                await response.text();

            debug('RAW RESPONSE: ' + text);

            const data =
                JSON.parse(text);

            if (!data.success) {

                debug(data.error || 'Load gagal');

                return;

            }

            renderPayments(
                data.payments || []
            );

        } catch (err) {

            console.error(err);

            debug(err.message);

        }

    }
        // =====================================
        // RENDER PAYMENTS
        // =====================================

        function renderPayments(payments) {

            const tbody =
                document.getElementById(
                    'paymentsBody'
                );

            document.getElementById(
                'pendingCount'
            ).textContent =
                payments.length;

            // EMPTY
            if (!payments.length) {

                tbody.innerHTML = `
                    <tr>

                        <td colspan="6">

                            <div class="empty-box">

                                ✅ Tidak ada payment pending

                            </div>

                        </td>

                    </tr>
                `;

                return;

            }

            tbody.innerHTML = '';

            payments.forEach(payment => {

                tbody.innerHTML += `

                    <tr>

                        <td>
                            ${payment.order_id}
                        </td>

                        <td>
                            ${payment.user_id}
                        </td>

                        <td>
                            ${payment.plan}
                        </td>

                        <td>
                            Rp ${Number(payment.amount).toLocaleString('id-ID')}
                        </td>

                        <td>
                            ${payment.date}
                        </td>

                        <td>

                            <button
                                class="approve-btn"
                                onclick="approvePayment('${payment.order_id}')">

                                ✔ Approve

                            </button>

                        </td>

                    </tr>

                `;

            });

        }

        // =====================================
        // APPROVE PAYMENT
        // =====================================

        async function approvePayment(orderId) {

            const yes =
                confirm(
                    `Approve payment ${orderId}?`
                );

            if (!yes) return;

            try {

                debug(
                    'APPROVE: ' + orderId
                );

                const payload = {

                    action:
                        'approve_payment',

                        admin_key: ADMIN_KEY,

                    order_id:
                        orderId

                };

                const response =
                    await fetch(GAS_URL, {

                        method: 'POST',

                        headers: {

                            'Content-Type':
                                'text/plain;charset=utf-8'

                        },

                        body:
                            JSON.stringify(payload)

                    });

                const text =
                    await response.text();

                debug(
                    'APPROVE RESPONSE: ' +
                    text
                );

                const result =
                    JSON.parse(text);

                if (result.success) {

                    alert(
                        '✅ Payment approved'
                    );

                    loadPayments();

                } else {

                    alert(
                        result.error ||
                        'Approve gagal'
                    );

                }

            } catch (err) {

                console.error(err);

                debug(
                    err.message
                );

                alert(
                    'Approve gagal'
                );

            }

        }

    </script>

</body>

</html>
