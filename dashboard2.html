<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Premium - Nihongo Mastery</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(135deg,
                    #0f2027,
                    #203a43,
                    #2c5364);
            color: white;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
        }

        .user-role {
            background: gold;
            color: black;
            padding: 8px 18px;
            border-radius: 999px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .logout-btn {
            border: none;
            background: #ff4757;
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background:
                rgba(255, 255, 255, 0.08);
            border:
                1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 25px;
        }

        .card h3 {
            margin-top: 0;
        }

        .big-number {
            font-size: 2rem;
            font-weight: bold;
            color: gold;
        }

        .progress-bar {
            height: 20px;
            border-radius: 20px;
            background:
                rgba(255, 255, 255, 0.2);
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            transition: 1s;
            background:
                linear-gradient(90deg,
                    #ff6b6b,
                    #ffd700,
                    #00ff88);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 20px;
        }

        .results-table th {
            background:
                rgba(255, 215, 0, 0.2);
            padding: 15px;
            text-align: left;
        }

        .results-table td {
            padding: 15px;
            background:
                rgba(255, 255, 255, 0.06);
            border-bottom:
                1px solid rgba(255, 255, 255, 0.05);
        }

        .cta-primary {
            border: none;
            background:
                linear-gradient(135deg,
                    #ffd700,
                    #ff9800);
            color: black;
            padding: 16px 30px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .cta-primary:hover {
            transform: translateY(-3px);
        }

        .exam-box {
            margin-top: 40px;
            text-align: center;
        }

        select {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: gold;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: gold;
        }

        @media(max-width:768px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">

        <!-- HEADER -->
        <div class="header">

            <div>

                <h1>
                    🎓 Dashboard Premium
                </h1>

                <h2 id="userNameDash">
                    Loading...
                </h2>

                <div class="user-role" id="userRoleBadge">
                    PREMIUM
                </div>

            </div>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

        <!-- STATS -->
        <div class="stats-grid">

            <div class="card">

                <h3>📈 Total Ujian</h3>

                <div class="big-number" id="totalExams">
                    0
                </div>

            </div>

            <div class="card">

                <h3>⭐ Best Score</h3>

                <div class="big-number" id="bestScore">
                    0%
                </div>

            </div>

            <div class="card">

                <h3>📊 Progress</h3>

                <div class="progress-bar">

                    <div class="progress-fill" id="progressFill">
                    </div>

                </div>

                <h2 id="progressText">
                    0%
                </h2>

            </div>

        </div>

        <!-- RESULTS -->
        <div class="card">

            <h2>
                📋 Hasil Ujian
            </h2>

            <table class="results-table">

                <thead>

                    <tr>
                        <th>Exam</th>
                        <th>Score</th>
                        <th>Date</th>
                    </tr>

                </thead>

                <tbody id="resultsTbody">

                    <tr>
                        <td colspan="3" class="loading">
                            Loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

        <!-- EXAM -->
        <div class="exam-box">

            <h2>
                🚀 Mulai Ujian Premium
            </h2>

            <select id="examSelect">

                <optgroup label="🎯 J.TEST">

                    <option value="jtest/de/written/v1">
                        📖 J.TEST Written v1
                    </option>

                    <option value="jtest/de/listening/v1">
                        🎧 J.TEST Listening v1
                    </option>

                </optgroup>

                <optgroup label="📖 JLPT N5">

                    <option value="jlpt/n5/written/v1">
                        📝 JLPT N5 Written v1
                    </option>

                    <option value="jlpt/n5/listening/v1">
                        🎧 JLPT N5 Listening v1
                    </option>

                </optgroup>

                <optgroup label="📝 JFT Basic">

                    <option value="jft/basic/written/v1">
                        📝 JFT Basic Written v1
                    </option>

                    <option value="jft/basic/listening/v1">
                        🎧 JFT Basic Listening v1
                    </option>

                </optgroup>

            </select>

            <br>

            <button class="cta-primary" onclick="startNewExam()">

                🔥 Mulai Ujian

            </button>

        </div>

    </div>

    <script>

        // =========================================
        // CHECK LOGIN
        // =========================================

        const USER_ID =
            localStorage.getItem('userId');

        const USER_NAME =
            localStorage.getItem('userName');

        const USER_ROLE =
            localStorage.getItem('userRole');

        console.log('USER:', USER_ID);
        console.log('ROLE:', USER_ROLE);

        if (!USER_ID) {

            alert('Login dulu!');

            window.location.href =
                'index.php';
        }

        // =========================================
        // FORCE PREMIUM ACCESS
        // =========================================

        const premiumRoles = [
            'premium',
            'pro',
            'lifetime'
        ];

        if (
            !premiumRoles.includes(USER_ROLE)
        ) {

            alert(
                'Akun belum premium!'
            );

            window.location.href =
                'index.php';
        }

        // =========================================
        // SET UI
        // =========================================

        document.getElementById(
            'userNameDash'
        ).textContent =
            USER_NAME || 'Premium User';

        document.getElementById(
            'userRoleBadge'
        ).textContent =
            USER_ROLE.toUpperCase();

        // =========================================
        // LOAD DASHBOARD
        // =========================================

        loadDashboard();

        async function loadDashboard() {

            try {

                const response =
                    await fetch(
                        `api/register.php?action=results&user_id=${USER_ID}`
                    );

                const data =
                    await response.json();

                console.log(data);

                updateResults(
                    data.results || []
                );

            } catch (err) {

                console.error(err);

                document.getElementById(
                    'resultsTbody'
                ).innerHTML = `
                    <tr>
                        <td colspan="3"
                            class="empty">
                            Gagal load data
                        </td>
                    </tr>
                `;
            }
        }

        // =========================================
        // UPDATE RESULTS
        // =========================================

        function updateResults(results) {

            const tbody =
                document.getElementById(
                    'resultsTbody'
                );

            if (!results.length) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="3"
                            class="empty">

                            Belum ada hasil ujian

                        </td>
                    </tr>
                `;

                return;
            }

            tbody.innerHTML = '';

            let bestScore = 0;

            results.forEach(result => {

                const score =
                    parseFloat(result.score);

                if (score > bestScore) {

                    bestScore = score;
                }

                tbody.innerHTML += `
                    <tr>

                        <td>
                            ${result.exam}
                        </td>

                        <td>
                            ${score.toFixed(0)}%
                        </td>

                        <td>
                            ${result.date}
                        </td>

                    </tr>
                `;
            });

            document.getElementById(
                'totalExams'
            ).textContent =
                results.length;

            document.getElementById(
                'bestScore'
            ).textContent =
                bestScore.toFixed(0) + '%';

            document.getElementById(
                'progressText'
            ).textContent =
                bestScore.toFixed(0) + '%';

            document.getElementById(
                'progressFill'
            ).style.width =
                bestScore + '%';
        }

        // =========================================
        // START EXAM
        // =========================================

        function startNewExam() {

            const examPath =
                document.getElementById(
                    'examSelect'
                ).value;

            // FORCE PREMIUM SESSION
            localStorage.setItem(
                'userRole',
                USER_ROLE
            );

            window.location.href =
                `exam.html?path=${encodeURIComponent(examPath)}&user=${USER_ID}`;
        }

        // =========================================
        // LOGOUT
        // =========================================

        function logout() {

            localStorage.clear();

            window.location.href =
                'index.php';
        }

    </script>

</body>

</html>
